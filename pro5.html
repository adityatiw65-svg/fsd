<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Faculty Details Form</title>

    <style>
        body{
            margin:0;
            padding:0;
            background:#dff3fc;
            font-family:Arial, Helvetica, sans-serif;
        }

        .container{
            width:450px;
            margin:40px auto;
            background:white;
            border:3px solid #0b9ddb;
            border-radius:15px;
            padding:25px;
        }

        h1{
            text-align:center;
            color:#0b9ddb;
            margin-bottom:25px;
        }

        label{
            font-size:18px;
            font-weight:bold;
        }

        input[type=text],
        input[type=email],
        input[type=number],
        select,
        textarea{
            width:100%;
            padding:10px;
            margin-top:8px;
            margin-bottom:18px;
            border:1px solid gray;
            border-radius:5px;
            font-size:16px;
            box-sizing:border-box;
        }

        textarea{
            resize:none;
        }

        .gender{
            margin-top:10px;
            margin-bottom:20px;
            font-size:18px;
        }

        .btn{
            width:48%;
            padding:10px;
            background:#0b9ddb;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        .btn:hover{
            background:#087fb2;
        }

        .buttons{
            display:flex;
            justify-content:space-between;
        }

    </style>

</head>
<body>
    <div class="container">
        <h1>Faculty Details</h1>
        <form on submit="return"> 
            <label>Faculty Name</label>
            <input type="text" placeholder="Enter Name">
            <label>Faculty ID</label>
            <input type="text" placeholder="Enter ID">
            <label>Department</label>
            <select>
                <option>CSE</option>
                <option>CS</option>
                <option>IT</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>ME</option>
                <option>CE</option>
            </select>
            <label>Gender</label>
            <div class="gender">
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
        </div>
        <label>Email</label>
        <input type="email" placeholder="Enter Email">
        <label>Mobile Number</label>
        <input type="number" placeholder="Enter Mobile Number">
        <label>Address</label>
        <textarea rows="4" placeholder="Enter Address"></textarea>
        <div class="buttons">
            <input type="submit" value="Submit" class="btn">
            <input type="reset" value="Reset" class="btn">
        </div>
    </form>
    <script>
        function validation(){
        var a=document.getElementById("name1").value;
        var b=document.getElementById("pass").value;
        if(a==""&& b=="")
    {
        alert("name and password not be empty.............");
        return false;
    } else if(b.length<10||b.length>10)
    {
        alert("password must be use 10 digit value...");
        return false;
    } else {
        true;
    }
        }

    </script>
</div>



</body>
</html>
